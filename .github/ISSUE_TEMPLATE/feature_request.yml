name: Feature request
description: Propose a product or engineering improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and user
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Contract and scope impact
      description: Mention PRD, architecture, template, AEM, or design-system implications.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution readiness
      options:
        - label: I searched existing issues and documentation.
          required: true
